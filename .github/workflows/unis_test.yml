name: UNIS Erisim ve Yayin Testi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: UNIS profilini kontrol et
        shell: bash
        run: |
          python - <<'PY'
          import re
          import urllib.request
          import urllib.error
          import socket
          from html.parser import HTMLParser

          url = 'https://unis.giresun.edu.tr/akademisyen-detay/onur.sahin'
          class Extract(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.parts = []
                  self.skip = 0
              def handle_starttag(self, tag, attrs):
                  if tag in ('script', 'style'):
                      self.skip += 1
              def handle_endtag(self, tag):
                  if tag in ('script', 'style') and self.skip:
                      self.skip -= 1
              def handle_data(self, data):
                  if not self.skip:
                      self.parts.append(data)

          print('URL:', url)
          try:
              req = urllib.request.Request(url, headers={
                  'User-Agent': 'Mozilla/5.0 (compatible; UNIS-Public-Access-Test/1.0)',
                  'Accept': 'text/html,application/xhtml+xml',
                  'Accept-Language': 'tr-TR,tr;q=0.9,en;q=0.7'
              })
              with urllib.request.urlopen(req, timeout=25) as response:
                  status = response.status
                  final_url = response.geturl()
                  content_type = response.headers.get('Content-Type', '')
                  raw = response.read(2_000_000)
              print('HTTP status:', status)
              print('Final URL:', final_url)
              print('Content-Type:', content_type)
              print('Downloaded bytes (max 2 MB):', len(raw))
              charset_match = re.search(r'charset=([\w-]+)', content_type, re.I)
              charset = charset_match.group(1) if charset_match else 'utf-8'
              html = raw.decode(charset, errors='replace')
              parser = Extract()
              parser.feed(html)
              visible = ' '.join(' '.join(parser.parts).split())
              print('Visible text characters:', len(visible))
              for label, pattern in {
                  'Makale': r'\bmakaleler?\b',
                  'Kitap': r'\bkitaplar?\b',
                  'Kitap bolumu': r'kitap\s+b[oö]l[uü]m',
                  'Bildiri': r'\bbildiriler?\b',
              }.items():
                  print(f'{label} keyword present:', bool(re.search(pattern, visible, re.I)))
              print('Page has meaningful visible text:', len(visible) > 500)
              print('NOTE: Keywords do not prove that publication records are extractable.')
              print('NOTE: No publication data was saved or changed.')
          except urllib.error.HTTPError as e:
              print('HTTP error:', e.code, e.reason)
              raise SystemExit(1)
          except (urllib.error.URLError, TimeoutError, socket.timeout, OSError) as e:
              print('Connection failed:', type(e).__name__, str(e))
              raise SystemExit(1)
          PY
