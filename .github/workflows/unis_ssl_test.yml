name: UNIS SSL Sertifika Testi

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ssl-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: DNS ve TLS sertifika zincirini kontrol et
        shell: bash
        run: |
          set +e
          echo '=== DNS ==='
          getent ahostsv4 unis.giresun.edu.tr | head -n 3
          echo '=== OpenSSL TLS certificate verification ==='
          timeout 20 openssl s_client -connect unis.giresun.edu.tr:443 -servername unis.giresun.edu.tr -verify_return_error -showcerts </dev/null 2>&1 | grep -E '^(depth=|verify error:|Verification error:|Verify return code:|subject=|issuer=|CONNECTED|Certificate chain| [0-9]+ s:)' | head -n 30
          echo '=== Python HTTPS with normal certificate verification ==='
          python - <<'PY'
          import ssl, urllib.request, urllib.error
          print('OpenSSL version:', ssl.OPENSSL_VERSION)
          print('Default CA paths:', ssl.get_default_verify_paths())
          url = 'https://unis.giresun.edu.tr/akademisyen-detay/onur.sahin'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0 (compatible; UNIS-SSL-Diagnostic/1.0)'})
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  print('HTTP status:', response.status)
                  print('Content-Type:', response.headers.get('Content-Type'))
          except Exception as e:
              print('HTTPS result:', type(e).__name__, str(e))
          print('Certificate verification was NOT disabled.')
          PY
